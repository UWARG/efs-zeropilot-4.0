name: ZP4 Lib Compile Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  compile_test_plane:
    runs-on: ubuntu-latest
    container:
      image: uwarg/efs-zeropilot-ci:v1.0.0

    steps:
    - name: Checkout the repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build project
      working-directory: ./zeropilot4.0
      run: bash ./hwbuild.bash -c -v plane -b l552 

  compile_test_quad:
    runs-on: ubuntu-latest
    container:
      image: uwarg/efs-zeropilot-ci:v1.0.0

    steps:
    - name: Checkout the repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build project
      working-directory: ./zeropilot4.0
      run: bash ./hwbuild.bash -c -v quad -b l552
