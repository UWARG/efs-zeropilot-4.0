name: Unit Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  unit_test_plane:
    runs-on: ubuntu-latest
    container:
      image: uwarg/efs-zeropilot-ci:v1.0.0

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build tests
      working-directory: ./zeropilot4.0/tests
      run: bash ./testbuild.bash -c -v plane
    
    - name: Run tests
      working-directory: ./zeropilot4.0/tests
      run: |
        chmod +x build/gtestzeropilot4.0
        ./build/gtestzeropilot4.0

  unit_test_quad:
    runs-on: ubuntu-latest
    container:
      image: uwarg/efs-zeropilot-ci:v1.0.0

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build tests
      working-directory: ./zeropilot4.0/tests
      run: bash ./testbuild.bash -c -v quad
    
    - name: Run tests
      working-directory: ./zeropilot4.0/tests
      run: |
        chmod +x build/gtestzeropilot4.0
        ./build/gtestzeropilot4.0
